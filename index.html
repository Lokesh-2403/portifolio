    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #050505;
      }

      #root {
        min-height: 100vh;
      }

      /* =========================================
         CYBERSECURITY INITIAL LOADER
         White + Cyan Theme
         ========================================= */

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(
            circle at center,
            rgba(0, 229, 255, 0.06),
            transparent 42%
          ),
          #050505;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        transition: opacity 0.5s ease;
      }

      /* Cyber grid */
      #initial-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(
            rgba(0, 229, 255, 0.035) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            rgba(0, 229, 255, 0.035) 1px,
            transparent 1px
          );
        background-size: 45px 45px;
        pointer-events: none;
      }

      /* Moving scan line */
      #initial-loader::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -10%;
        height: 1px;
        background: rgba(0, 229, 255, 0.18);
        box-shadow: 0 0 18px rgba(0, 229, 255, 0.3);
        animation: scan-line 3s linear infinite;
        pointer-events: none;
      }

      .loader-content {
        position: relative;
        z-index: 2;
        width: min(90%, 520px);
        text-align: center;
      }

      /* Name */
      .loader-name {
        color: #ffffff;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 6px;
        margin-bottom: 10px;
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.15);
      }

      /* Cyan subtitle */
      .loader-subtitle {
        color: #00e5ff;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 3px;
        margin-bottom: 38px;
        text-shadow:
          0 0 8px rgba(0, 229, 255, 0.35);
      }

      /* Security emblem */
      .loader-emblem {
        width: 54px;
        height: 54px;
        margin: 0 auto 30px;
        border: 1px solid rgba(0, 229, 255, 0.7);
        position: relative;
        transform: rotate(45deg);
        box-shadow:
          0 0 15px rgba(0, 229, 255, 0.12);
        animation: emblem-pulse 2s ease-in-out infinite;
      }

      .loader-emblem::before {
        content: "";
        position: absolute;
        inset: 9px;
        border: 1px solid rgba(255, 255, 255, 0.7);
      }

      .loader-emblem::after {
        content: "";
        position: absolute;
        inset: 19px;
        background: #00e5ff;
        box-shadow:
          0 0 12px rgba(0, 229, 255, 0.8);
      }

      /* Terminal section */
      .loader-terminal {
        width: min(100%, 390px);
        margin: 0 auto 28px;
        text-align: left;
        font-family: "Courier New", monospace;
        font-size: 12px;
        line-height: 2;
      }

      .terminal-line {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        color: rgba(255, 255, 255, 0.75);
      }

      .terminal-prefix {
        color: #00e5ff;
      }

      .terminal-status {
        color: #00e5ff;
        font-weight: 700;
        text-shadow:
          0 0 7px rgba(0, 229, 255, 0.45);
      }

      /* Progress heading */
      .loader-progress-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: min(100%, 390px);
        margin: 0 auto 8px;
        color: rgba(255, 255, 255, 0.7);
        font-family: "Courier New", monospace;
        font-size: 10px;
        letter-spacing: 1.5px;
      }

      .loader-progress-label span:last-child {
        color: #00e5ff;
      }

      /* Progress bar */
      .loader-bar {
        width: min(100%, 390px);
        height: 3px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        border-radius: 2px;
      }

      .loader-progress {
        width: 0%;
        height: 100%;
        background: #00e5ff;
        box-shadow:
          0 0 10px rgba(0, 229, 255, 0.7);
        animation: loader-progress 2s ease-out forwards;
      }

      /* Footer */
      .loader-footer {
        width: min(100%, 390px);
        margin: 18px auto 0;
        display: flex;
        justify-content: space-between;
        color: rgba(255, 255, 255, 0.45);
        font-family: "Courier New", monospace;
        font-size: 9px;
        letter-spacing: 1.5px;
      }

      .loader-footer .online {
        color: #00e5ff;
        text-shadow:
          0 0 7px rgba(0, 229, 255, 0.45);
      }

      /* =========================================
         ANIMATIONS
         ========================================= */

      @keyframes scan-line {
        0% {
          transform: translateY(0);
        }

        100% {
          transform: translateY(120vh);
        }
      }

      @keyframes emblem-pulse {
        0%,
        100% {
          opacity: 0.65;
          box-shadow:
            0 0 12px rgba(0, 229, 255, 0.08);
        }

        50% {
          opacity: 1;
          box-shadow:
            0 0 22px rgba(0, 229, 255, 0.2);
        }
      }

      @keyframes loader-progress {
        0% {
          width: 0%;
        }

        100% {
          width: 100%;
        }
      }

      /* =========================================
         MOBILE
         ========================================= */

      @media (max-width: 600px) {
        .loader-name {
          font-size: 23px;
          letter-spacing: 4px;
        }

        .loader-subtitle {
          font-size: 10px;
          letter-spacing: 2px;
        }

        .loader-terminal {
          font-size: 10px;
        }

        .loader-progress-label,
        .loader-footer {
          font-size: 8px;
        }
      }
    </style>
  </head>
