    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #050505;
      }

      #root {
        min-height: 100vh;
      }

      /* Initial loading screen */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050505;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }

      .loader-content {
        text-align: center;
      }

      .loader-name {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 4px;
        margin-bottom: 10px;
      }

      .loader-subtitle {
        font-size: 13px;
        letter-spacing: 2px;
        opacity: 0.7;
      }

      .loader-bar {
        width: 180px;
        height: 2px;
        background: #222;
        margin: 25px auto 0;
        overflow: hidden;
      }

      .loader-progress {
        width: 40%;
        height: 100%;
        background: #ffffff;
        animation: loader-animation 1.2s infinite ease-in-out;
      }

      @keyframes loader-animation {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>

  <body>

      <div class="loader-content">
        <div class="loader-name">
          LOKESH BABU ADUSUMALLI
        </div>

        <div class="loader-subtitle">
          CYBERSECURITY STUDENT · ASPIRING SOC ANALYST
        </div>

        <div class="loader-bar">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>

    <!-- React application -->
    <div id="root"></div>

    <script>
  window.addEventListener("load", function () {
    const loader = document.getElementById("initial-loader");

    if (loader) {
      setTimeout(function () {
        loader.style.opacity = "0";
        loader.style.transition = "opacity 0.5s ease";

        setTimeout(function () {
          loader.remove();
        }, 500);
      }, 2500);
    }
  });
</script>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
